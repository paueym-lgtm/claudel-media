<div id="pageContent" class="page-content">

<section class="page-hero">
    <h1>Journaux</h1>
    <p>Découvrez les éditions du journal de Claudel média.</p>
</section>

<main class="container">

    <div id="journaux" class="grid">
        <div class="empty">Chargement...</div>
    </div>

</main>

<footer>
    © 2026 Claudel média
</footer>

</div>

<script>

async function loadJournaux() {

    const container = document.getElementById("journaux");

    const { data, error } = await supabaseClient
        .from("journaux")
        .select("*")
        .eq("published", true)
        .order("created_at", { ascending: false });

    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Impossible de charger les journaux.</div>';

        return;

    }

    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun journal publié pour le moment.</div>';

        return;

    }

    container.innerHTML = "";

    data.forEach(journal => {

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            ${journal.cover_url
                ? `<div class="icon" style="background-image:url('${escapeHTML(journal.cover_url)}');background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;font-size:0;"></div>`
                : `<div class="icon">📰</div>`}

            <h2>${escapeHTML(journal.title)}</h2>

            <p>${escapeHTML(journal.description || "")}</p>

            <a class="button" href="${journal.pdf_url}" target="_blank">
                Lire le journal
            </a>

        `;

        container.appendChild(card);

    });

}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

loadJournaux();

</script>

</body>
