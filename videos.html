<div id="pageContent" class="page-content">

<section class="page-hero">
    <h1>Vidéos</h1>
    <p>Les reportages, émissions et créations de Claudel média.</p>
</section>

<main class="container">

    <div id="videos" class="grid">
        <div class="empty">Chargement des vidéos...</div>
    </div>

</main>

<footer>
    © 2026 Claudel média — Collège catholique Samuel-Genest
</footer>

</div>

<script>

async function loadVideos() {

    const container = document.getElementById("videos");

    const { data, error } = await supabaseClient
        .from("videos")
        .select("*")
        .eq("published", true)
        .order("created_at", { ascending: false });

    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Impossible de charger les vidéos.</div>';

        return;
    }

    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune vidéo publiée pour le moment.</div>';

        return;
    }

    container.innerHTML = "";

    data.forEach(video => {

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            <video controls preload="metadata"
                ${video.thumbnail_url ? `poster="${video.thumbnail_url}"` : ""}>
                <source src="${video.video_url}">
                Votre navigateur ne supporte pas la vidéo.
            </video>

            <h2>${escapeHTML(video.title)}</h2>

            <p>${escapeHTML(video.description || "")}</p>

            <div class="date">
                ${new Date(video.created_at).toLocaleDateString("fr-CA")}
            </div>

        `;

        container.appendChild(card);

    });
}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

loadVideos();

</script>

</body>
