<script>

async function loadVideos() {

    const container = document.getElementById("videos");

    const [categoriesRes, videosRes] = await Promise.all([

        supabaseClient
            .from("categories")
            .select("*")
            .eq("content_type", "videos")
            .order("name", { ascending: true }),

        supabaseClient
            .from("videos")
            .select("*")
            .eq("published", true)
            .order("created_at", { ascending: false })

    ]);

    if (videosRes.error) {

        console.error(videosRes.error);

        container.innerHTML =
            '<div class="empty">Impossible de charger les vidéos.</div>';

        return;
    }

    const data = videosRes.data;
    const categories = categoriesRes.data || [];

    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune vidéo publiée pour le moment.</div>';

        return;
    }

    function cardHTML(video) {

        const videoId = "video-" + Math.random().toString(36).slice(2, 10);

        return `
            <article class="card">

                <div class="video-wrap" id="${videoId}">
                    <video controls preload="metadata"
                        ${video.thumbnail_url ? `poster="${video.thumbnail_url}"` : ""}
                        onerror="showVideoFallback('${videoId}', '${encodeURI(video.video_url)}')">
                        <source src="${video.video_url}" type="video/mp4">
                        Votre navigateur ne supporte pas la vidéo.
                    </video>
                </div>

                <h2>${escapeHTML(video.title)}</h2>

                <p>${escapeHTML(video.description || "")}</p>

                <div class="date">
                    ${new Date(video.created_at).toLocaleDateString("fr-CA")}
                </div>

            </article>
        `;

    }

    const groups = categories.map(cat => ({
        id: cat.id,
        name: cat.name,
        items: data.filter(v => v.category_id === cat.id)
    })).filter(group => group.items.length > 0);

    const uncategorized = data.filter(v =>
        !v.category_id || !categories.some(c => c.id === v.category_id)
    );

    let html = "";

    groups.forEach(group => {
        html += `
            <h3 class="section-title" style="margin-top:36px;">${escapeHTML(group.name)}</h3>
            <div class="grid scroll-grid">${group.items.map(cardHTML).join("")}</div>
        `;
    });

    if (uncategorized.length > 0) {

        html += `
            ${groups.length > 0 ? `<h3 class="section-title" style="margin-top:36px;">Autres vidéos</h3>` : ""}
            <div class="grid scroll-grid">${uncategorized.map(cardHTML).join("")}</div>
        `;

    }

    container.innerHTML = html;

    enhanceScrollGrids(container);

}

function showVideoFallback(wrapId, encodedUrl) {

    const wrap = document.getElementById(wrapId);
    if (!wrap || wrap.dataset.fallbackShown) return;

    wrap.dataset.fallbackShown = "1";

    wrap.innerHTML = `
        <div class="video-fallback">
            <div class="video-fallback-icon">🎬</div>
            <p>La lecture directe n'a pas fonctionné pour cette vidéo.</p>
            <a class="button" href="${decodeURI(encodedUrl)}" target="_blank" rel="noopener">
                Ouvrir / télécharger la vidéo
            </a>
        </div>
    `;

}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

loadVideos();

</script>
