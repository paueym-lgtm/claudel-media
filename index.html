<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Prix</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:Arial,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:20px;z-index:9999}
#err{max-width:800px;padding:30px;text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="loading">Chargement du Grand Prix…</div>
<script>
(async()=>{
 try{
   const parts=["grand-prix-parts/part1.txt","grand-prix-parts/part2.txt","grand-prix-parts/part3.txt"];
   const texts=[];
   for(const p of parts){
     const r=await fetch(p+"?v=1",{cache:"no-store"});
     if(!r.ok) throw new Error("Impossible de charger "+p);
     texts.push(await r.text());
   }
   document.open();
   document.write(texts.join(""));
   document.close();
 }catch(e){
   document.body.innerHTML='<div id="err"><h2>Erreur de chargement</h2><p>'+String(e.message||e).replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))+'</p><p>Recharge la page.</p></div>';
 }
})();
</script>
</body>
</html>
