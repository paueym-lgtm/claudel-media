<script>

async function loadPodcasts() {

    const container = document.getElementById("podcasts");

    const [categoriesRes, podcastsRes] = await Promise.all([

        supabaseClient
            .from("categories")
            .select("*")
            .eq("content_type", "podcasts")
            .order("name", { ascending: true }),

        supabaseClient
            .from("podcasts")
            .select("*")
            .eq("published", true)
            .order("created_at", { ascending: false })

    ]);

    if (podcastsRes.error) {

        console.error(podcastsRes.error);

        container.innerHTML =
            '<div class="empty">Impossible de charger les podcasts.</div>';

        return;

    }

    const data = podcastsRes.data;
    const categories = categoriesRes.data || [];

    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucun podcast publié pour le moment.</div>';

        return;

    }

    function cardHTML(podcast) {

        return `
            <article class="card">

                ${podcast.cover_url
                    ? `<div class="cover" style="background-image:url('${escapeHTML(podcast.cover_url)}');background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;font-size:0;"></div>`
                    : `<div class="cover">🎙️</div>`}

                <h2>${escapeHTML(podcast.title)}</h2>

                <p>${escapeHTML(podcast.description || "")}</p>

                <audio controls>
                    <source src="${podcast.audio_url}">
                    Votre navigateur ne supporte pas l'audio.
                </audio>

            </article>
        `;

    }

    const groups = categories.map(cat => ({
        id: cat.id,
        name: cat.name,
        items: data.filter(p => p.category_id === cat.id)
    })).filter(group => group.items.length > 0);

    const uncategorized = data.filter(p =>
        !p.category_id || !categories.some(c => c.id === p.category_id)
    );

    let html = "";

    groups.forEach(group => {
        html += `
            <h3 class="section-title" style="margin-top:36px;">${escapeHTML(group.name)}</h3>
            <div class="grid scroll-grid">${group.items.map(cardHTML).join("")}</div>
        `;
    });

    if (uncategorized.length > 0) {

        html += `
            ${groups.length > 0 ? `<h3 class="section-title" style="margin-top:36px;">Autres podcasts</h3>` : ""}
            <div class="grid scroll-grid">${uncategorized.map(cardHTML).join("")}</div>
        `;

    }

    container.innerHTML = html;

    enhanceScrollGrids(container);

}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

loadPodcasts();

</script>
