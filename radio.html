</head>

<body>

<button id="menuToggle" class="menu-toggle">
    <span>☰</span>
</button>

<aside id="sidebar" class="sidebar">

    <div class="logo">
        <div class="logo-badge">C</div>
        <img data-logo alt="Logo">
        <span class="text" data-setting="site_name">Claudel Média</span>
    </div>

    <div class="sidebar-label">Navigation</div>

    <nav id="sidebarNav">
        <a href="index.html">
            <span class="icon">🏠</span>
            <span class="text">Accueil</span>
        </a>
        <a href="videos.html">
            <span class="icon">🎥</span>
            <span class="text">Vidéos</span>
        </a>
        <a href="journaux.html">
            <span class="icon">📰</span>
            <span class="text">Journaux</span>
        </a>
        <a href="podcasts.html">
            <span class="icon">🎙️</span>
            <span class="text">Podcasts</span>
        </a>
        <a href="radio.html">
            <span class="icon">📻</span>
            <span class="text">Radio</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="sidebar-footer-text">© 2026 Claudel média</div>
    </div>

</aside>

<div id="pageContent" class="page-content">

<section class="page-hero">

    <div class="page-live">
        <span class="page-live-dot"></span>
        Claudel média
    </div>

    <h1>Radio</h1>
    <p>Écoutez les émissions de Claudel média.</p>

</section>

<section class="radio-player">

    <h2>📻 Claudel média Radio</h2>

    <p id="status" style="color:var(--muted);margin-bottom:18px;">
        La radio en direct sera bientôt disponible.
    </p>

    <button onclick="startRadio()">▶ Écouter la radio</button>

    <audio id="radioAudio" controls style="display:none;margin-top:18px;"></audio>

</section>

<main class="container">

    <h3 class="section-title">Dernières émissions</h3>

    <div id="emissions" class="grid">
        <div class="empty">Chargement...</div>
    </div>

</main>

<footer>
    © 2026 Claudel média
</footer>

</div>

<script>

async function loadEmissions() {

    const container = document.getElementById("emissions");

    const { data, error } = await supabaseClient
        .from("emissions")
        .select("*")
        .eq("published", true)
        .order("created_at", { ascending: false });

    if (error) {

        console.error(error);

        container.innerHTML =
            '<div class="empty">Impossible de charger les émissions.</div>';

        return;

    }

    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty">Aucune émission publiée pour le moment.</div>';

        return;

    }

    container.innerHTML = "";

    data.forEach(emission => {

        const card = document.createElement("article");

        card.className = "card";

        card.innerHTML = `

            ${emission.cover_url
                ? `<div class="cover" style="background-image:url('${escapeHTML(emission.cover_url)}');background-size:contain;background-repeat:no-repeat;background-position:center;background-color:#fff;font-size:0;"></div>`
                : `<div class="cover">📻</div>`}

            <h2>${escapeHTML(emission.title)}</h2>

            <p>${escapeHTML(emission.description || "")}</p>

            <audio controls>
                <source src="${emission.audio_url}">
                Votre navigateur ne supporte pas l'audio.
            </audio>

        `;

        container.appendChild(card);

    });

}

function startRadio() {

    const audio = document.getElementById("radioAudio");
    const status = document.getElementById("status");

    status.textContent =
        "Le flux radio en direct n'est pas encore configuré.";

    audio.style.display = "block";

}

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

loadEmissions();

</script>

</body>
</html>
